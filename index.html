<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#05060a"/>
<title>Love · P&amp;L</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --obsidian:#05060a; --panel:#0c0f18; --panel-2:#10131f;
  --ink:#eef1f8; --ink-dim:#9aa3bd; --ink-faint:#5b6480; --line:rgba(255,255,255,.08);
  --profit:#5ff2b0; --loss:#ff6b6b; --gold:#ffd98a;
  --holo-1:#6fe9ff; --holo-2:#34e0b0; --holo-3:#8affd0; --holo-4:#ffd98a; --holo-5:#5fd0ff;
  --holo: linear-gradient(105deg,var(--holo-1),var(--holo-2) 30%,var(--holo-3) 52%,var(--holo-4) 74%,var(--holo-5));
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--obsidian);color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;
  background:
    radial-gradient(1100px 600px at 78% -8%, rgba(111,233,255,.10), transparent 60%),
    radial-gradient(900px 520px at 12% 4%, rgba(52,224,176,.10), transparent 60%),
    radial-gradient(1000px 800px at 50% 118%, rgba(255,217,138,.06), transparent 60%),
    var(--obsidian);
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 20px);}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.pos{color:var(--profit)} .neg{color:var(--loss)}

/* holographic foil */
.foil{
  background:var(--holo);background-size:220% 220%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:sheen 9s ease-in-out infinite;
}
@keyframes sheen{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.holobar{height:3px;border-radius:3px;background:var(--holo);background-size:220% 100%;animation:sheen 9s ease-in-out infinite}

/* header */
header{padding:22px 0 6px;position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg,rgba(5,6,10,.94),rgba(5,6,10,.72) 70%,transparent);
  backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:11px}
.logo{width:34px;height:34px;flex:0 0 34px}
.brand h1{font-family:'Space Grotesk';font-weight:600;font-size:19px;letter-spacing:1.5px;margin:0}
.brand .sub{font-size:11px;color:var(--ink-faint);letter-spacing:.4px;text-transform:uppercase;margin-top:1px}

/* year tabs */
.yeartabs{display:flex;gap:14px;scroll-snap-type:x proximity;margin:16px 0 4px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.yeartabs::-webkit-scrollbar{display:none}
.ytab{white-space:nowrap;scroll-snap-align:start;padding:10px 18px;border-radius:12px;font-family:'Space Grotesk';font-weight:500;
  font-size:13.5px;color:var(--ink-dim);background:var(--panel);border:1px solid var(--line);position:relative}
.ytab.active{color:var(--ink);background:var(--panel-2)}
.ytab.active::after{content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:2px;border-radius:2px;
  background:var(--holo);background-size:200% 100%;animation:sheen 9s ease-in-out infinite}
.ytab.add{color:var(--holo-2);font-weight:600;padding:10px 15px;margin-left:4px}

/* sub view toggle */
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;margin:14px 0 18px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13.5px;font-weight:500;color:var(--ink-dim);transition:.15s}
.seg button.on{color:var(--obsidian);background:linear-gradient(105deg,#dffcf5,#eafcff);font-weight:600}

/* cards */
.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);
  border-radius:var(--r);padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.card.holo::before{content:"";position:absolute;inset:0;padding:1px;border-radius:var(--r);
  background:var(--holo);background-size:220% 220%;animation:sheen 9s ease-in-out infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:.55;pointer-events:none}
.eyebrow{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-faint);font-weight:600}

/* hero */
.hero{padding:24px 20px 22px}
.hero .label{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.hero .big{font-family:'Space Grotesk';font-weight:700;font-size:clamp(42px,13vw,66px);line-height:1;
  letter-spacing:-1.5px;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.hero .cur{font-size:.42em;vertical-align:.32em;font-weight:500;margin-right:4px;color:var(--ink-dim)}
.hero .note{font-size:12.5px;color:var(--ink-dim);margin-top:8px;line-height:1.5}
.hero .fypill{display:inline-block;font-size:11px;font-weight:600;color:var(--holo-1);
  border:1px solid rgba(122,240,255,.28);border-radius:999px;padding:3px 10px;margin-bottom:2px}

/* stat strip */
.strip{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
.strip .cell{background:var(--panel);padding:14px 15px}
.strip .k{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-faint);font-weight:600}
.strip .v{font-family:'JetBrains Mono';font-weight:500;font-size:19px;margin-top:5px}
@media(min-width:560px){.strip{grid-template-columns:repeat(4,1fr)}}

/* breakdown */
.brk{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.brk:last-child{border-bottom:none}
.brk .bk{font-size:13.5px;color:var(--ink-dim)} .brk .bk b{color:var(--ink);font-weight:500}
.brk .bv{font-family:'JetBrains Mono';font-size:15px;font-weight:500}

/* charts */
.chart{width:100%;height:150px;display:block}
.axis{stroke:var(--line);stroke-width:1}
.gridln{stroke:rgba(255,255,255,.05);stroke-width:1}

/* ledger */
.grp{margin-top:6px}
.grp h4{font-family:'Space Grotesk';font-size:14px;font-weight:600;margin:14px 0 6px;display:flex;justify-content:space-between}
.grp h4 .gt{font-family:'JetBrains Mono';font-weight:500}
.acct{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.acct .an{color:var(--ink-dim)} .acct .an b{color:var(--ink);font-weight:500;font-family:'JetBrains Mono'}
.acct .ap{font-family:'JetBrains Mono';font-weight:500;font-size:14px}
.acct .per{display:block;font-size:11px;color:var(--ink-faint);margin-top:2px}

/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.mnav b{font-family:'Space Grotesk';font-size:17px;font-weight:600}
.mnav button{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
  color:var(--ink-dim);font-size:18px;display:grid;place-items:center}
.mnav button:disabled{opacity:.3}

/* entries list */
.ent{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ent .en{font-size:13.5px;color:var(--ink)} .ent .ed{font-size:11.5px;color:var(--ink-faint);margin-top:2px}
.ent .ev{font-family:'JetBrains Mono';font-weight:500;font-size:15px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:12px 16px;border-radius:13px;
  font-weight:600;font-size:14px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink);width:100%}
.btn.primary{color:var(--obsidian);background:linear-gradient(105deg,#8ff2ff,#4fe6c0 55%,#ffe3a3);border:none}
.btn.ghost{background:transparent}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btnrow.three{grid-template-columns:1fr 1fr 1fr}

/* empty state */
.empty{text-align:center;padding:34px 20px}
.empty .em{font-family:'Space Grotesk';font-size:19px;font-weight:600;margin:12px 0 6px}
.empty .es{font-size:13.5px;color:var(--ink-dim);line-height:1.6;max-width:340px;margin:0 auto 18px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(3,4,8,.72);backdrop-filter:blur(4px);z-index:60;
  display:none;align-items:flex-end;justify-content:center;padding:0}
.scrim.show{display:flex}
.sheet{background:var(--panel-2);border:1px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;
  width:100%;max-width:760px;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);max-height:90vh;overflow:auto}
.sheet h3{font-family:'Space Grotesk';font-size:18px;font-weight:600;margin:2px 0 16px}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;color:var(--ink-dim);margin-bottom:6px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:12px 13px;border-radius:12px;background:var(--panel);
  border:1px solid var(--line);color:var(--ink);font-family:'JetBrains Mono';font-size:15px}
.field input:focus,.field select:focus{outline:none;border-color:var(--holo-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-dim);margin:4px 0 14px}
.check input{width:18px;height:18px}
.dim{color:var(--ink-faint);font-size:12px;line-height:1.55}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%) translateY(20px);
  background:var(--panel-2);border:1px solid var(--line);border-radius:13px;padding:12px 18px;font-size:13.5px;font-weight:500;
  z-index:90;opacity:0;transition:.28s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:40;
  padding:14px 20px;border-radius:16px;font-family:'Space Grotesk';font-weight:600;font-size:14.5px;color:var(--obsidian);
  background:linear-gradient(105deg,#8ff2ff,#4fe6c0 55%,#ffe3a3);box-shadow:0 8px 30px rgba(52,224,176,.22)}
@media(prefers-reduced-motion:reduce){.foil,.holobar,.card.holo::before,.ytab.active::after{animation:none}}
</style>
</head>

/* Love · P&L — holographic edition. Vanilla, single-file, iOS-first. */
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const KEY='lovepl-v3';
const AUD=n=>{const s=n<0?'-':'+';const v=Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});return s+'$'+v;};
const AUD0=n=>{const s=n<0?'-':'';const v=Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:0,maximumFractionDigits:0});return s+'$'+v;};
const cls=n=>n>=0?'pos':'neg';
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---- FY helpers (AU: 1 Jul – 30 Jun) ---- */
const fyOfDate=ds=>{const d=new Date(ds+'T00:00:00');const m=d.getMonth()+1,y=d.getFullYear();return m>=7?y:y-1;};
const fyLabel=fy=>`FY ${fy}–${String(fy+1).slice(2)}`;
const currentFY=()=>{const n=new Date();return (n.getMonth()+1)>=7?n.getFullYear():n.getFullYear()-1;};
const entryFY=e=>e.fy!=null?e.fy:(e.period?fyOfDate('2000-01-01'):currentFY());

/* ---- state ---- */
let S=load();
function latestActivity(){const ds=(S.logs||[]).filter(l=>!isAdj(l)).map(l=>l.date).sort();return ds.length?ds[ds.length-1]:null;}
let sel;

function load(){
  try{const raw=localStorage.getItem(KEY);if(raw)return JSON.parse(raw);}catch(e){}
  const seed=JSON.parse(SEED);           // SEED injected below
  seed.extraYears=[currentFY()];         // FY2026-27 available from day one
  try{localStorage.setItem(KEY,JSON.stringify(seed));}catch(e){}
  return seed;
}
function save(s){S=s||S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function allFYs(){
  const set=new Set();
  (S.entries||[]).forEach(e=>set.add(entryFY(e)));
  (S.logs||[]).forEach(l=>set.add(fyOfDate(l.date)));
  (S.extraYears||[]).forEach(y=>set.add(y));
  set.add(currentFY());
  return [...set].sort((a,b)=>b-a);
}
function pickDefaultFY(){
  // default to the most recent FY that actually has data
  try{const s=JSON.parse(localStorage.getItem(KEY)||SEED);
    const yrs=new Set();(s.logs||[]).forEach(l=>yrs.add(fyOfDate(l.date)));
    return yrs.size?Math.max(...yrs):currentFY();
  }catch(e){return currentFY();}
}

/* ---- selectors on data ---- */
const logsFY=fy=>(S.logs||[]).filter(l=>fyOfDate(l.date)===fy);
const entriesFY=fy=>(S.entries||[]).filter(e=>entryFY(e)===fy);
const isMonthly=l=>/^mo\d{6}/.test(l.id);
const isAdj=l=>l.adj===true;

function ytd(fy){return logsFY(fy).reduce((a,l)=>a+ (+l.profit||0),0);}          // incl. commission
function tradingTotal(fy){return logsFY(fy).filter(l=>!isAdj(l)).reduce((a,l)=>a+(+l.profit||0),0);}
function commission(fy){return logsFY(fy).filter(isAdj).reduce((a,l)=>a+(+l.profit||0),0);}

function monthlySeries(fy){ // 12 buckets Jul..Jun, trading only (no adj)
  const buckets={};
  logsFY(fy).filter(l=>!isAdj(l)).forEach(l=>{const k=l.date.slice(0,7);buckets[k]=(buckets[k]||0)+(+l.profit||0);});
  const out=[];for(let i=0;i<12;i++){const m=(6+i)%12;const y=m>=6?fy:fy+1;const key=`${y}-${String(m+1).padStart(2,'0')}`;out.push({key,m,y,label:MON[m],v:buckets[key]||0,has:key in buckets});}
  return out;
}
function equity(fy){let run=0;return monthlySeries(fy).map(p=>{run+=p.v;return {...p,cum:run};});}

/* ---- broker ledger ---- */
function ledger(fy){
  const g={};entriesFY(fy).forEach(e=>{(g[e.broker]=g[e.broker]||[]).push(e);});
  return Object.entries(g).map(([broker,list])=>({broker,list:list.sort((a,b)=>b.netPL-a.netPL),
    total:list.reduce((a,e)=>a+(+e.netPL||0),0)})).sort((a,b)=>b.total-a.total);
}

/* ---- month view data ---- */
function monthsWithData(fy){const s=new Set();logsFY(fy).filter(l=>!isAdj(l)).forEach(l=>s.add(l.date.slice(0,7)));return [...s].sort();}
function currentMonthKey(fy){
  if(sel.month)return sel.month;
  const m=monthsWithData(fy);return m.length?m[m.length-1]:`${fy}-07`;
}
function monthLogs(key){return (S.logs||[]).filter(l=>!isAdj(l)&&l.date.slice(0,7)===key).sort((a,b)=>a.date<b.date?1:-1);}
function weeklyLogs(fy){return logsFY(fy).filter(l=>!isAdj(l)&&!isMonthly(l));}

/* ================= RENDER ================= */
function render(){
  $('#subline').textContent=fyLabel(sel.fy).replace('FY','Financial year');
  renderYearTabs();renderSeg();
  $('#app').innerHTML = sel.view==='month'?viewMonth():viewYear();
  wireDynamic();
}

function renderYearTabs(){
  const tabs=$('#yeartabs');const fys=allFYs();
  tabs.innerHTML=fys.map(fy=>`<button class="ytab ${fy===sel.fy?'active':''}" data-fy="${fy}">${fyLabel(fy)}</button>`).join('')
    +`<button class="ytab add" id="addyear">＋ Year</button>`;
  tabs.querySelectorAll('[data-fy]').forEach(b=>b.onclick=()=>{sel.fy=+b.dataset.fy;sel.month=null;render();});
  $('#addyear').onclick=addYear;
}
function renderSeg(){
  $('#seg').querySelectorAll('button').forEach(b=>{
    b.classList.toggle('on',b.dataset.view===sel.view);
    b.onclick=()=>{sel.view=b.dataset.view;render();};
  });
}

/* ---------- YEAR VIEW ---------- */
function viewYear(){
  const fy=sel.fy, y=ytd(fy), tr=tradingTotal(fy), com=commission(fy);
  const has=logsFY(fy).length>0;
  if(!has) return emptyYear(fy);
  const ser=monthlySeries(fy), eq=equity(fy);
  const wins=ser.filter(p=>p.has&&p.v>0).length, losses=ser.filter(p=>p.has&&p.v<0).length;
  const best=ser.reduce((a,p)=>p.v>a.v?p:a,{v:-1e18,label:'—'});
  const led=ledger(fy);
  const grossDep=entriesFY(fy).reduce((a,e)=>a+(+e.deposits||0),0);
  const grossWd=entriesFY(fy).reduce((a,e)=>a+(+e.withdrawals||0),0);

  return `
  <section class="card holo hero">
    <span class="fypill">${fyLabel(fy)}</span>
    <div class="label">Year to date</div>
    <div class="big foil"><span class="cur">A$</span>${Math.abs(y).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
    <div class="note">${y>=0?'Net profit':'Net loss'} across ${entriesFY(fy).length} accounts${com?` · incl. ${AUD(com)} commission / other`:''}.</div>
  </section>

  <section class="card">
    <div class="eyebrow">Breakdown</div>
    <div style="margin-top:8px">
      <div class="brk"><span class="bk"><b>Trading</b> — account ledger</span><span class="bv ${cls(tr)}">${AUD(tr)}</span></div>
      ${com?`<div class="brk"><span class="bk"><b>Commission / other</b></span><span class="bv ${cls(com)}">${AUD(com)}</span></div>`:''}
      <div class="brk"><span class="bk"><b>Year total</b></span><span class="bv ${cls(y)}" style="font-size:17px">${AUD(y)}</span></div>
    </div>
  </section>

  <div class="strip">
    <div class="cell"><div class="k">Best month</div><div class="v ${cls(best.v)}">${AUD0(best.v)}<div style="font-size:11px;color:var(--ink-faint)">${best.label}</div></div></div>
    <div class="cell"><div class="k">Winning months</div><div class="v">${wins}<span style="color:var(--ink-faint);font-size:13px"> / ${wins+losses}</span></div></div>
    <div class="cell"><div class="k">Deposits</div><div class="v mono">${AUD0(grossDep)}</div></div>
    <div class="cell"><div class="k">Withdrawals</div><div class="v mono">${AUD0(grossWd)}</div></div>
  </div>

  <section class="card">
    <div class="eyebrow">Equity curve</div>
    ${lineChart(eq)}
  </section>

  <section class="card">
    <div class="eyebrow">Monthly P/L</div>
    ${barChart(ser)}
  </section>

  <section class="card">
    <div class="eyebrow">Account ledger</div>
    ${led.map(g=>`
      <div class="grp"><h4>${g.broker}<span class="gt ${cls(g.total)}">${AUD(g.total)}</span></h4>
      ${g.list.map(e=>`<div class="acct"><span class="an"><b>${e.account}</b><span class="per">${e.period||''}</span></span><span class="ap ${cls(e.netPL)}">${AUD(e.netPL)}</span></div>`).join('')}
      </div>`).join('')}
  </section>

  <section class="card">
    <div class="eyebrow" style="margin-bottom:12px">Data</div>
    <div class="btnrow three">
      <button class="btn" data-act="export">Back up</button>
      <button class="btn" data-act="restore">Restore</button>
      <button class="btn" data-act="share-year">Share</button>
    </div>
  </section>`;
}

function emptyYear(fy){
  const rm=isRemovable(fy);
  return `<section class="card holo empty">
    <div class="holobar" style="width:60px;margin:0 auto 4px"></div>
    <div class="em foil">${fyLabel(fy)} — a clean slate</div>
    <div class="es">No trades logged for this year yet. Log your first week as it happens, or import a broker statement when the month closes.</div>
    <div class="btnrow" style="max-width:320px;margin:0 auto">
      <button class="btn primary" data-act="log-week">Log this week</button>
      <button class="btn" data-act="restore">Restore</button>
    </div>
    ${rm?`<button class="btn ghost" style="margin:12px auto 0;max-width:320px;color:var(--loss)" data-act="remove-year">Remove ${fyLabel(fy)}</button>`:''}
  </section>`;
}

/* ---------- MONTH VIEW ---------- */
function viewMonth(){
  const fy=sel.fy;
  if(!logsFY(fy).length) return emptyYear(fy);
  const months=monthsWithData(fy);
  const key=currentMonthKey(fy);
  const idx=months.indexOf(key);
  const [yy,mm]=key.split('-').map(Number);
  const total=monthLogs(key).reduce((a,l)=>a+(+l.profit||0),0);
  const wk=weeklyLogs(fy);
  const wkThis=wk.filter(l=>l.date.slice(0,7)===key);
  const bestWk=wk.reduce((a,l)=>l.profit>a?l.profit:a,-1e18);
  const avgWk=wk.length?wk.reduce((a,l)=>a+l.profit,0)/wk.length:0;
  const entries=monthLogs(key);

  return `
  <div class="mnav">
    <button data-mnav="-1" ${idx<=0?'disabled':''}>‹</button>
    <b>${MON[mm-1]} ${yy}</b>
    <button data-mnav="1" ${idx>=months.length-1?'disabled':''}>›</button>
  </div>

  <section class="card holo hero" style="padding-top:20px">
    <div class="label">${MON[mm-1]} profit</div>
    <div class="big foil"><span class="cur">A$</span>${Math.abs(total).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})}</div>
    <div class="note">${entries.length} ${entries.length===1?'entry':'entries'} this month.</div>
  </section>

  <div class="strip">
    <div class="cell"><div class="k">This week</div><div class="v ${wkThis.length?cls(wkThis[0].profit):''}">${wkThis.length?AUD0(wkThis[0].profit):'—'}</div></div>
    <div class="cell"><div class="k">Best week</div><div class="v ${bestWk>-1e17?cls(bestWk):''}">${bestWk>-1e17?AUD0(bestWk):'—'}</div></div>
    <div class="cell"><div class="k">Avg / week</div><div class="v ${wk.length?cls(avgWk):''}">${wk.length?AUD0(avgWk):'—'}</div></div>
    <div class="cell"><div class="k">Weeks logged</div><div class="v">${wk.length||'—'}</div></div>
  </div>

  <section class="card">
    <div class="eyebrow" style="margin-bottom:6px">Entries</div>
    ${entries.length?entries.map(l=>`<div class="ent"><div><div class="en">${l.note||'Trading P/L'}</div><div class="ed">${l.date}${l.account?' · acct '+l.account:''}</div></div><div class="ev ${cls(l.profit)}">${AUD(l.profit)}</div></div>`).join(''):'<div class="dim" style="padding:10px 0">Nothing logged for this month yet.</div>'}
  </section>

  <section class="card">
    <div class="btnrow"><button class="btn primary" data-act="log-week">Log this week</button><button class="btn" data-act="log-month">Log a month</button></div>
  </section>`;
}

/* ================= CHARTS ================= */
function barChart(ser){
  const W=680,H=150,pad=6,n=ser.length,bw=(W-pad*2)/n*0.62,gap=(W-pad*2)/n;
  const max=Math.max(1,...ser.map(p=>Math.abs(p.v)));const mid=H/2;
  const bars=ser.map((p,i)=>{const x=pad+i*gap+(gap-bw)/2;const h=Math.abs(p.v)/max*(mid-14);
    const y=p.v>=0?mid-h:mid;const col=p.v>=0?'var(--profit)':'var(--loss)';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,p.has?1.5:0).toFixed(1)}" rx="2" fill="${col}" opacity="${p.has?.92:.15}"/>
    <text x="${(x+bw/2).toFixed(1)}" y="${H-2}" fill="var(--ink-faint)" font-size="9" text-anchor="middle" font-family="JetBrains Mono">${p.label[0]}</text>`;}).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line class="axis" x1="${pad}" y1="${mid}" x2="${W-pad}" y2="${mid}"/>${bars}</svg>`;
}
function lineChart(eq){
  const W=680,H=150,pad=8;const vals=eq.map(p=>p.cum);
  const mn=Math.min(0,...vals),mx=Math.max(0,...vals),rng=(mx-mn)||1;
  const X=i=>pad+i*(W-pad*2)/(eq.length-1);
  const Y=v=>H-10-((v-mn)/rng)*(H-24);
  const pts=eq.map((p,i)=>`${X(i).toFixed(1)},${Y(p.cum).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)},${Y(0).toFixed(1)} `+eq.map((p,i)=>`L${X(i).toFixed(1)},${Y(p.cum).toFixed(1)}`).join(' ')+` L${X(eq.length-1).toFixed(1)},${Y(0).toFixed(1)} Z`;
  const zero=Y(0);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="lgc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7af0ff"/><stop offset=".5" stop-color="#b388ff"/><stop offset="1" stop-color="#6affc4"/></linearGradient>
      <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b388ff" stop-opacity=".28"/><stop offset="1" stop-color="#b388ff" stop-opacity="0"/></linearGradient></defs>
    <line class="gridln" x1="${pad}" y1="${zero.toFixed(1)}" x2="${W-pad}" y2="${zero.toFixed(1)}"/>
    <path d="${area}" fill="url(#fill)"/>
    <polyline points="${pts}" fill="none" stroke="url(#lgc)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    ${eq.map((p,i)=>p.has?`<circle cx="${X(i).toFixed(1)}" cy="${Y(p.cum).toFixed(1)}" r="2.4" fill="#eef1f8"/>`:'').join('')}
  </svg>`;
}

/* ================= ACTIONS ================= */
function wireDynamic(){
  document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act));
  document.querySelectorAll('[data-mnav]').forEach(b=>b.onclick=()=>{
    const months=monthsWithData(sel.fy);let i=months.indexOf(currentMonthKey(sel.fy));
    i+= +b.dataset.mnav; if(i>=0&&i<months.length){sel.month=months[i];render();}
  });
}
$('#fab').onclick=()=>logWeek();

function act(a){
  if(a==='log-week')return logWeek();
  if(a==='log-month')return logMonth();
  if(a==='export')return doExport();
  if(a==='restore')return restore();
  if(a==='share-year')return shareYear();
  if(a==='remove-year')return removeYear(sel.fy);
}

const scrim=$('#scrim'),sheet=$('#sheet');

scrim.onclick=e=>{if(e.target===scrim)closeSheet();};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900);}

function logWeek(){
  const today=new Date().toISOString().slice(0,10);
  openSheet(`<h3>Log this week</h3>
    <div class="field"><label>Week ending</label><input id="f-date" type="date" value="${today}"></div>
    <div class="field"><label>Profit / loss (AUD)</label><input id="f-prof" inputmode="decimal" placeholder="e.g. 3327.23"></div>
    <div class="field"><label>Note (optional)</label><input id="f-note" placeholder="e.g. XAUUSD week"></div>
    <button class="btn primary" id="f-save">Save week</button>
    <button class="btn ghost" style="margin-top:8px" onclick="__close()">Cancel</button>`);
  $('#f-save').onclick=()=>{
    const p=parseFloat($('#f-prof').value);if(isNaN(p)){toast('Enter a number');return;}
    const d=$('#f-date').value||today;
    S.logs.push({id:'wk'+Date.now(),date:d,profit:p,deposit:0,withdrawal:0,swap:0,commission:0,balance:null,account:'',note:$('#f-note').value||'Weekly P/L',hasShot:false});
    // route selection to the FY of this entry
    sel.fy=fyOfDate(d);sel.month=d.slice(0,7);
    save();closeSheet();render();toast('Week logged');
  };
}
function logMonth(){
  openSheet(`<h3>Log a month</h3>
    <div class="two"><div class="field"><label>Month</label><select id="f-mon">${MON.map((m,i)=>`<option value="${i+1}">${m}</option>`).join('')}</select></div>
    <div class="field"><label>Year</label><input id="f-year" inputmode="numeric" value="${new Date().getFullYear()}"></div></div>
    <div class="field"><label>Total profit / loss (AUD)</label><input id="f-prof" inputmode="decimal" placeholder="e.g. 15568.15"></div>
    <div class="field"><label>Note (optional)</label><input id="f-note" placeholder="All accounts — monthly P/L"></div>
    <button class="btn primary" id="f-save">Save month</button>
    <button class="btn ghost" style="margin-top:8px" onclick="__close()">Cancel</button>`);
  $('#f-save').onclick=()=>{
    const p=parseFloat($('#f-prof').value);if(isNaN(p)){toast('Enter a number');return;}
    const mo=+$('#f-mon').value,yr=+$('#f-year').value;
    const last=new Date(yr,mo,0).getDate();const d=`${yr}-${String(mo).padStart(2,'0')}-${String(last).padStart(2,'0')}`;
    const id='mo'+yr+String(mo).padStart(2,'0');
    S.logs=S.logs.filter(l=>l.id!==id);
    S.logs.push({id,date:d,profit:p,deposit:0,withdrawal:0,swap:0,commission:0,balance:null,account:'',note:$('#f-note').value||'All accounts — monthly P/L',hasShot:false});
    sel.fy=fyOfDate(d);sel.month=d.slice(0,7);
    save();closeSheet();render();toast('Month saved');
  };
}
function isRemovable(fy){
  return fy!==currentFY() && logsFY(fy).length===0 && entriesFY(fy).length===0 && (S.extraYears||[]).includes(fy);
}
function addYear(){
  const latest=Math.max(currentFY(),...allFYs());
  if(logsFY(latest).length===0 && entriesFY(latest).length===0){
    sel.fy=latest;sel.view='year';sel.month=null;render();toast(fyLabel(latest)+' is already open');return;
  }
  const next=latest+1;
  S.extraYears=S.extraYears||[];if(!S.extraYears.includes(next))S.extraYears.push(next);
  sel.fy=next;sel.view='year';sel.month=null;save();render();toast(fyLabel(next)+' opened');
}
function removeYear(fy){
  if(!isRemovable(fy)){toast('Only empty years can be removed');return;}
  S.extraYears=(S.extraYears||[]).filter(y=>y!==fy);save();
  const d=latestActivity();sel.fy=d?fyOfDate(d):currentFY();sel.view='month';sel.month=d?d.slice(0,7):null;
  render();toast(fyLabel(fy)+' removed');
}

/* export / import / share */
function doExport(){
  const out={name:S.name||'',entries:S.entries||[],logs:S.logs||[]};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');
  a.href=url;a.download='meridian-data.json';a.click();URL.revokeObjectURL(url);
  toast('Backup downloaded');
}
function restore(){
  openSheet(`<h3>Restore data</h3>
    <p class="dim" style="margin:-6px 0 14px">Load a <b>meridian-data.json</b> backup. Merges into what you have unless you replace everything.</p>
    <div class="field"><input id="f-file" type="file" accept=".json,application/json" style="font-family:Inter;padding:10px"></div>
    <label class="check"><input id="f-replace" type="checkbox"> Replace everything (wipe current data first)</label>
    <button class="btn primary" id="f-load">Load file</button>
    <button class="btn ghost" style="margin-top:8px" onclick="__close()">Cancel</button>`);
  $('#f-load').onclick=()=>{
    const f=$('#f-file').files[0];if(!f){toast('Choose a file');return;}
    const rep=$('#f-replace').checked;const rd=new FileReader();
    rd.onload=()=>{try{
      const j=JSON.parse(rd.result);
      if(rep){S={name:j.name||'',entries:j.entries||[],logs:j.logs||[],extraYears:[currentFY()]};}
      else{
        S.name=S.name||j.name||'';
        const eids=new Set((S.entries||[]).map(e=>e.id));(j.entries||[]).forEach(e=>{if(!eids.has(e.id))S.entries.push(e);});
        const lids=new Set((S.logs||[]).map(l=>l.id));(j.logs||[]).forEach(l=>{if(!lids.has(l.id))S.logs.push(l);});
      }
      sel.fy=pickDefaultFY();sel.month=null;save();closeSheet();render();toast(rep?'Data replaced':'Data merged');
    }catch(err){toast('Could not read file');}};
    rd.readAsText(f);
  };
}
function shareYear(){
  const fy=sel.fy,y=ytd(fy),tr=tradingTotal(fy),com=commission(fy);
  const txt=`Love · P&L — ${fyLabel(fy)}
Year to date: ${AUD(y)}
Trading: ${AUD(tr)}${com?`\nCommission / other: ${AUD(com)}`:''}
Accounts: ${entriesFY(fy).length}`;
  if(navigator.share){navigator.share({text:txt}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast('Copied to clipboard'));}
  else toast('Sharing not supported');
}
window.__close=closeSheet;

/* boot */
const _d=latestActivity();
sel=_d?{fy:fyOfDate(_d),view:'month',month:_d.slice(0,7)}:{fy:currentFY(),view:'month',month:null};
render();

</script>
</body>
